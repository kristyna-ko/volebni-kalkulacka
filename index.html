<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Průvodce názory společnosti</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2f7;
}

.container{
max-width:900px;
margin:0 auto;
padding:20px;
}

.chat{
height:75vh;
overflow-y:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.message{
margin-bottom:15px;
padding:15px;
border-radius:12px;
max-width:80%;
line-height:1.6;
}

.bot{
background:#f1f5f9;
}

.user{
background:#1976d2;
color:white;
margin-left:auto;
}

.typing{
font-style:italic;
color:#666;
}

.options{
margin-top:15px;
}

.options button{
width:100%;
padding:12px;
margin-bottom:8px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.a{
background:#0d47a1;
color:white;
}

.b{
background:#ef6c00;
color:white;
}

.n{
background:#eceff1;
}

.hidden{
display:none;
}

</style>

</head>
<body>

<div class="container">

<div class="chat" id="chat"></div>

<div class="options" id="options"></div>

</div>

<script>

const questions = [

{
intro:"Představ si, že ve městě není dost dostupných bytů.",
a:"Město by mělo investovat do stavby dostupných bytů.",
b:"Byty by měli stavět hlavně soukromí investoři.",

reactions:{
aStrong:"Mnoho měst v Evropě řeší podobnou otázku a používá různé přístupy k podpoře bydlení.",
aSoft:"Bydlení je oblast, kde se často hledá rovnováha mezi veřejnou a soukromou iniciativou.",
neutral:"Je běžné vidět výhody i nevýhody obou přístupů.",
bSoft:"Někteří lidé věří, že konkurence mezi investory může přinést více možností.",
bStrong:"Otázka role soukromého sektoru při výstavbě patří mezi častá témata veřejných debat."
}
},

{
intro:"Veřejná doprava ovlivňuje každodenní život mnoha lidí.",
a:"Doprava by měla být levná nebo zdarma pro mladé.",
b:"Každý by měl platit podle toho, jak dopravu využívá.",

reactions:{
aStrong:"Mnohá města se snaží motivovat mladé lidi k využívání veřejné dopravy.",
aSoft:"Cena dopravy může výrazně ovlivnit způsob cestování lidí.",
neutral:"Existují různé názory na to, jak financovat veřejnou dopravu.",
bSoft:"Některé systémy staví na principu, že každý přispívá podle využití služby.",
bStrong:"Financování veřejné dopravy je dlouhodobě diskutovaným tématem ve většině měst."
}
}

];

let current = -1;

const chat = document.getElementById("chat");
const options = document.getElementById("options");

function addMessage(text,type){

const div=document.createElement("div");

div.className="message "+type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;
}

function typingIndicator(){

const div=document.createElement("div");

div.className="message bot typing";

div.id="typing";

div.innerHTML="🤖 píše...";

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;
}

function removeTyping(){

const t=document.getElementById("typing");

if(t) t.remove();

}

function typeBotMessage(text,callback){

typingIndicator();

setTimeout(()=>{

removeTyping();

const bubble=document.createElement("div");

bubble.className="message bot";

chat.appendChild(bubble);

let i=0;

const interval=setInterval(()=>{

bubble.innerHTML=text.substring(0,i);

i++;

chat.scrollTop=chat.scrollHeight;

if(i>text.length){

clearInterval(interval);

if(callback) callback();

}

},15);

},800);
}

function askQuestion(){

current++;

if(current>=questions.length){

showResult();

return;

}

const q=questions[current];

typeBotMessage(`
<b>Otázka ${current+1}</b><br><br>
${q.intro}<br><br>
<b>A:</b> ${q.a}<br><br>
<b>B:</b> ${q.b}
`,()=>{

options.innerHTML=
`
<button class="a" onclick="answer('aStrong','Určitě A')">Určitě A</button>

<button class="a" onclick="answer('aSoft','Spíše A')">Spíše A</button>

<button class="n" onclick="answer('neutral','Neutrální')">Neutrální</button>

<button class="b" onclick="answer('bSoft','Spíše B')">Spíše B</button>

<button class="b" onclick="answer('bStrong','Určitě B')">Určitě B</button>
`;

});

}

function answer(type,text){

const q=questions[current];

addMessage(text,"user");

options.innerHTML="";

typeBotMessage(q.reactions[type],()=>{

setTimeout(()=>{

askQuestion();

},700);

});

}

function showResult(){

typeBotMessage(`
✅ Děkuji za odpovědi.

V této ukázkové verzi nyní následuje vyhodnocení.

Do finální verze lze doplnit:
<ul>
<li>25 otázek</li>
<li>výpočet osy Levice-Pravice</li>
<li>výpočet osy Progresivní-Konzervativní</li>
<li>graf s bodem respondenta</li>
<li>škálu populismu</li>
<li>závěrečný profil žáka</li>
</ul>
`);
}

window.onload=()=>{

typeBotMessage(`
Ahoj! 👋

Jsem průvodce, který ti pomůže zjistit, jak přemýšlíš o různých tématech ve společnosti.

Nejde o test správných odpovědí a nebudu ti doporučovat žádnou politickou stranu.

Po každé odpovědi si krátce popovídáme a potom dostaneš další otázku.

Jsi připraven?
`,()=>{

askQuestion();

});

};

</script>

</body>
</html>
